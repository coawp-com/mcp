# checks server.json on every push and pull request, and publishes it to the official mcp registry
# (registry.modelcontextprotocol.io) when a version tag like v2.0.0 is pushed. publishing signs in as coawp.com with
# the ed25519 key whose public half is the coawp.com dns txt record. the private key is the MCP_PRIVATE_KEY secret of
# the mcp-registry-publish environment, which only v* tags can use
name: Registry

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # update on purpose, never to a moving "latest"
  MCP_PUBLISHER_VERSION: v1.8.9

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install mcp-publisher
        run: scripts/install-mcp-publisher.sh
      - name: Validate server.json
        run: ./mcp-publisher validate server.json
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(jq -r .version server.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match server.json version $version"
            exit 1
          fi

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    concurrency: mcp-registry-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install mcp-publisher
        run: scripts/install-mcp-publisher.sh
      - name: Sign in as coawp.com
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        # 1.8.9 takes the key only as a flag (reading MCP_PRIVATE_KEY itself comes later); actions masks it in the log
        run: ./mcp-publisher login dns --domain coawp.com --private-key "$MCP_PRIVATE_KEY"
      - name: Publish
        run: ./mcp-publisher publish server.json
